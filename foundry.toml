[profile.default]
optimizer_runs = 200
src = "src"
out = "out"
libs = ["lib"]
bytecode_hash = "none"
# for tenderly verify
cbor_metadata=true
fs_permissions = [{ access = "read-write", path = "./"}]
auto_detect_solc = true
ffi=true
# multiple calls to block.number would get optimized to just returning a constant value, instead of actually accessing the current block.number with via-ir
via_ir=true

[profile.default.fuzz]
runs = 10

[profile.ci.fuzz]
runs = 100

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
